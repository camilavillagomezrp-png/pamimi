<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Panini FIFA World Cup 2026 🏆</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e63946;
    --gold: #f4a32a;
    --green: #2ec27e;
    --blue: #1d6fa4;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1a1a2e;
    --muted: #6b7280;
    --border: #e2e8f0;
    --shadow: 0 4px 20px rgba(0,0,0,0.10);
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    padding: 16px 16px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon { font-size: 28px; }
  .logo-text { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); letter-spacing: 1px; line-height: 1; }
  .logo-sub { font-size: 10px; color: #94a3b8; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
  .global-stats {
    display: flex;
    gap: 8px;
  }
  .stat-pill {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 4px 10px;
    text-align: center;
  }
  .stat-pill .num { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--gold); line-height: 1; }
  .stat-pill .lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 0;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 10px 10px 0 0;
    border: none;
    background: rgba(255,255,255,0.07);
    color: #94a3b8;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .tab.active {
    background: var(--bg);
    color: var(--text);
  }
  .tab:hover:not(.active) { background: rgba(255,255,255,0.12); color: white; }

  /* PAGES */
  .page { display: none; padding: 16px; }
  .page.active { display: block; }

  /* DASHBOARD */
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    margin-top: 18px;
  }
  .section-title:first-child { margin-top: 0; }

  /* SPECIAL STICKERS ROW */
  .special-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 4px;
    margin-bottom: 6px;
  }
  .special-row::-webkit-scrollbar { display: none; }
  .special-card {
    flex-shrink: 0;
    background: white;
    border-radius: 12px;
    padding: 10px 14px;
    cursor: pointer;
    border: 2px solid var(--border);
    transition: all 0.2s;
    min-width: 130px;
    box-shadow: var(--shadow);
  }
  .special-card:active { transform: scale(0.96); }
  .special-card .sc-icon { font-size: 22px; margin-bottom: 4px; }
  .special-card .sc-name { font-weight: 800; font-size: 12px; color: var(--text); }
  .special-card .sc-prog { font-size: 11px; color: var(--muted); }
  .special-card .sc-bar { height: 4px; background: var(--border); border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .special-card .sc-bar-fill { height: 100%; border-radius: 4px; background: var(--gold); transition: width 0.4s; }

  /* GROUPS GRID */
  .groups-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .group-card {
    background: white;
    border-radius: var(--radius);
    padding: 12px;
    cursor: pointer;
    border: 2px solid var(--border);
    box-shadow: var(--shadow);
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .group-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--group-color, var(--gold));
  }
  .group-card:active { transform: scale(0.97); }
  .group-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .group-letter {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--group-color, var(--gold));
    line-height: 1;
  }
  .group-pct {
    font-weight: 800;
    font-size: 13px;
    color: var(--muted);
  }
  .group-flags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .flag-chip {
    display: flex;
    align-items: center;
    gap: 3px;
    background: var(--bg);
    border-radius: 6px;
    padding: 2px 6px;
    font-size: 11px;
    font-weight: 700;
  }
  .flag-chip .fi { font-size: 14px; }
  .group-progress {
    margin-top: 8px;
    height: 5px;
    background: var(--border);
    border-radius: 5px;
    overflow: hidden;
  }
  .group-progress-fill {
    height: 100%;
    border-radius: 5px;
    background: var(--group-color, var(--gold));
    transition: width 0.5s ease;
  }

  /* COUNTRY VIEW */
  .back-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: white;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 14px;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: all 0.15s;
  }
  .back-btn:active { transform: scale(0.97); }

  .country-header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    color: white;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .country-flag-big { font-size: 42px; }
  .country-name { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--gold); }
  .country-stats-row { display: flex; gap: 12px; margin-top: 6px; }
  .cstat { text-align: center; }
  .cstat-num { font-family: 'Bebas Neue', sans-serif; font-size: 20px; }
  .cstat-lbl { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
  .cstat.green .cstat-num { color: var(--green); }
  .cstat.red .cstat-num { color: var(--red); }
  .cstat.gold .cstat-num { color: var(--gold); }

  /* STICKER GRID */
  .sticker-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .sticker-card {
    background: white;
    border-radius: 10px;
    padding: 8px 6px;
    text-align: center;
    cursor: pointer;
    border: 2px solid var(--border);
    transition: all 0.15s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    position: relative;
  }
  .sticker-card.have {
    border-color: var(--green);
    background: #f0fdf4;
  }
  .sticker-card.duplicate {
    border-color: var(--gold);
    background: #fffbeb;
  }
  .sticker-card:active { transform: scale(0.93); }
  .sticker-code {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    color: var(--blue);
    line-height: 1;
  }
  .sticker-name {
    font-size: 9px;
    color: var(--muted);
    font-weight: 600;
    margin-top: 3px;
    line-height: 1.2;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .sticker-check {
    position: absolute;
    top: 3px; right: 3px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--green);
    display: none;
    align-items: center;
    justify-content: center;
  }
  .sticker-card.have .sticker-check { display: flex; }
  .sticker-check svg { width: 8px; height: 8px; }
  .sticker-foil { background: linear-gradient(135deg, #ffd700, #ffb300); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 8px; font-weight: 800; }
  .sticker-dup-badge {
    position: absolute;
    top: 3px; left: 3px;
    background: var(--gold);
    color: white;
    border-radius: 6px;
    font-size: 8px;
    font-weight: 800;
    padding: 1px 4px;
    display: none;
  }
  .sticker-card.duplicate .sticker-dup-badge { display: block; }

  /* GROUP COUNTRY LIST */
  .countries-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .country-row {
    background: white;
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    border: 2px solid var(--border);
    box-shadow: var(--shadow);
    transition: all 0.15s;
  }
  .country-row:active { transform: scale(0.98); }
  .country-row-flag { font-size: 28px; }
  .country-row-info { flex: 1; }
  .country-row-name { font-weight: 800; font-size: 15px; }
  .country-row-sub { font-size: 11px; color: var(--muted); }
  .country-row-pct {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--muted);
  }
  .country-row-bar { width: 60px; height: 5px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .country-row-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }

  /* INTERCAMBIOS PAGE */
  .swap-section {
    background: white;
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
    border: 2px solid var(--border);
    box-shadow: var(--shadow);
  }
  .swap-title { font-weight: 800; font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .swap-list { display: flex; flex-direction: column; gap: 8px; }
  .swap-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: var(--bg);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
  }
  .swap-code { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: var(--blue); min-width: 48px; }
  .swap-delete {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--red);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .empty-state { text-align: center; color: var(--muted); padding: 20px 0; font-size: 13px; }
  .action-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .action-btn.primary { background: var(--blue); color: white; }
  .action-btn.success { background: var(--green); color: white; }
  .action-btn.danger { background: var(--red); color: white; }
  .action-btn:active { transform: scale(0.97); }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    display: none;
    align-items: flex-end;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: white;
    border-radius: 20px 20px 0 0;
    padding: 20px 16px 32px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 16px; }
  .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; margin-bottom: 4px; }
  .modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .modal-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1a1a2e;
    color: white;
    padding: 10px 20px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 700;
    opacity: 0;
    transition: all 0.3s;
    z-index: 300;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* LOADING */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    flex-direction: column;
    gap: 12px;
    color: var(--muted);
    font-weight: 700;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* SEARCH */
  .search-bar {
    display: flex;
    align-items: center;
    background: white;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    gap: 8px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .search-bar input {
    flex: 1;
    border: none;
    outline: none;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    background: transparent;
  }
  .search-bar svg { color: var(--muted); }
</style>
</head>

// Generar stickers de cada selección
function genCountryStickers(code) {
  const players = PLAYER_DATA[code] || [];
  const stickers = [];
  stickers.push({code:`${code}1`, name:'Team Logo', foil:true});
  for(let i=2;i<=12;i++){
    const p = players[i-2] || `Jugador ${i}`;
    stickers.push({code:`${code}${i}`, name:p, foil:false});
  }
  stickers.push({code:`${code}13`, name:'Team Photo', foil:false});
  for(let i=14;i<=20;i++){
    const p = players[i-3] || `Jugador ${i}`;
    stickers.push({code:`${code}${i}`, name:p, foil:false});
  }
  return stickers;
}

// ============================================================
// STATE
// ============================================================
let collection = {}; // { code: 0|1|2+ (0=no, 1=tengo, 2+=duplicados) }
let currentGroup = null;
let currentCountry = null;
let isReady = false;

// ============================================================
// SUPABASE FUNCTIONS
// ============================================================
async function loadCollection() {
  try {
    const { data, error } = await sb.from('panini_collection')
      .select('sticker_code, status')
      .eq('user_id', USER_ID);
    if (error) throw error;
    collection = {};
    if (data) data.forEach(r => { collection[r.sticker_code] = r.status; });
  } catch(e) {
    console.error('Load error:', e);
    // Offline mode: usar localStorage
    const saved = localStorage.getItem('panini_collection');
    if (saved) collection = JSON.parse(saved);
  }
}

async function saveSticker(code, status) {
  try {
    const { error } = await sb.from('panini_collection')
      .upsert({ user_id: USER_ID, sticker_code: code, status: status }, { onConflict: 'user_id,sticker_code' });
    if (error) throw error;
  } catch(e) {
    console.error('Save error:', e);
  }
  // Siempre guardar localmente también
  localStorage.setItem('panini_collection', JSON.stringify(collection));
}

// ============================================================
// INIT
// ============================================================
async function init() {
  document.getElementById('loading-screen').style.display = 'flex';
  await loadCollection();
  document.getElementById('loading-screen').style.display = 'none';
  isReady = true;
  renderDashboard();
  showTab('dashboard');
}

// ============================================================
// TABS
// ============================================================
function showTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    const tabs = ['dashboard','buscar','intercambios'];
    t.classList.toggle('active', tabs[i] === tab || (tab==='group' && tabs[i]==='dashboard') || (tab==='country' && tabs[i]==='dashboard'));
  });
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  if (tab === 'dashboard') {
    document.getElementById('page-dashboard').classList.add('active');
    renderDashboard();
  } else if (tab === 'group') {
    document.getElementById('page-group').classList.add('active');
    renderGroupView();
  } else if (tab === 'country') {
    document.getElementById('page-country').classList.add('active');
    renderCountryView();
  } else if (tab === 'buscar') {
    document.getElementById('page-buscar').classList.add('active');
    document.getElementById('search-input').value = '';
    document.getElementById('search-results').innerHTML = '';
  } else if (tab === 'intercambios') {
    document.getElementById('page-intercambios').classList.add('active');
    renderIntercambios();
  }
}

// ============================================================
// RENDER DASHBOARD
// ============================================================
function renderDashboard() {
  // Globals
  let totalHave = 0, totalAll = 0;
  Object.values(collection).forEach(v => { if(v>=1) totalHave++; });

  // Count total stickers
  Object.values(SPECIAL_SECTIONS).forEach(s => totalAll += s.stickers.length);
  Object.values(GROUPS).forEach(g => g.countries.forEach(c => totalAll += 20));
  
  document.getElementById('total-have').textContent = totalHave;
  document.getElementById('total-missing').textContent = totalAll - totalHave;

  // Special sections
  const specialRow = document.getElementById('special-row');
  specialRow.innerHTML = '';
  Object.entries(SPECIAL_SECTIONS).forEach(([key, section]) => {
    const have = section.stickers.filter(s => (collection[s.code]||0) >= 1).length;
    const total = section.stickers.length;
    const pct = Math.round(have/total*100);
    const div = document.createElement('div');
    div.className = 'special-card';
    div.innerHTML = `
      <div class="sc-icon">${section.icon}</div>
      <div class="sc-name">${section.name}</div>
      <div class="sc-prog">${have}/${total} stickers</div>
      <div class="sc-bar"><div class="sc-bar-fill" style="width:${pct}%"></div></div>
    `;
    div.onclick = () => openSpecialSection(key);
    specialRow.appendChild(div);
  });

  // Groups
  const grid = document.getElementById('groups-grid');
  grid.innerHTML = '';
  Object.entries(GROUPS).forEach(([letter, group]) => {
    let gHave = 0, gTotal = group.countries.length * 20;
    group.countries.forEach(c => {
      for(let i=1;i<=20;i++) { if((collection[`${c}${i}`]||0)>=1) gHave++; }
    });
    const pct = Math.round(gHave/gTotal*100);
    const card = document.createElement('div');
    card.className = 'group-card';
    card.style.setProperty('--group-color', group.color);
    card.innerHTML = `
      <div class="group-header">
        <div class="group-letter">G${letter}</div>
        <div class="group-pct">${pct}%</div>
      </div>
      <div class="group-flags">
        ${group.countries.map(c => `<div class="flag-chip"><span class="fi">${COUNTRY_INFO[c]?.flag||'🏳'}</span>${c}</div>`).join('')}
      </div>
      <div class="group-progress"><div class="group-progress-fill" style="width:${pct}%"></div></div>
    `;
    card.onclick = () => { currentGroup = letter; showTab('group'); };
    grid.appendChild(card);
  });
}

// ============================================================
// GROUP VIEW
// ============================================================
function renderGroupView() {
  const group = GROUPS[currentGroup];
  const el = document.getElementById('group-content');
  const color = group.color;
  el.innerHTML = `
    <div style="background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:16px;padding:14px 16px;margin-bottom:14px;color:white;display:flex;align-items:center;gap:12px;">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:48px;color:${color};line-height:1">G${currentGroup}</div>
      <div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:${color}">GRUPO ${currentGroup}</div>
        <div style="font-size:12px;color:#94a3b8">Toca un país para ver sus stickers</div>
      </div>
    </div>
    <div class="countries-list" id="countries-list"></div>
  `;
  const list = document.getElementById('countries-list');
  group.countries.forEach(code => {
    const info = COUNTRY_INFO[code] || {name:code,flag:'🏳'};
    let have = 0;
    for(let i=1;i<=20;i++) { if((collection[`${code}${i}`]||0)>=1) have++; }
    const pct = Math.round(have/20*100);
    const row = document.createElement('div');
    row.className = 'country-row';
    row.innerHTML = `
      <div class="country-row-flag">${info.flag}</div>
      <div class="country-row-info">
        <div class="country-row-name">${info.name}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:3px;">
          <div class="country-row-bar" style="width:80px;">
            <div class="country-row-bar-fill" style="width:${pct}%;background:${color}"></div>
          </div>
          <div style="font-size:11px;color:var(--muted);font-weight:700">${have}/20</div>
        </div>
      </div>
      <div class="country-row-pct" style="color:${pct===100?'var(--green)':color}">${pct}%</div>
      <div style="color:var(--muted)">›</div>
    `;
    row.onclick = () => { currentCountry = code; showTab('country'); };
    list.appendChild(row);
  });
}

// ============================================================
// COUNTRY VIEW
// ============================================================
function renderCountryView() {
  const code = currentCountry;
  const info = COUNTRY_INFO[code] || {name:code,flag:'🏳'};
  const stickers = genCountryStickers(code);
  let have = stickers.filter(s => (collection[s.code]||0)>=1).length;
  let dups = stickers.filter(s => (collection[s.code]||0)>=2).length;
  const el = document.getElementById('country-content');

  el.innerHTML = `
    <div class="country-header">
      <div class="country-flag-big">${info.flag}</div>
      <div style="flex:1">
        <div class="country-name">${info.name}</div>
        <div class="country-stats-row">
          <div class="cstat green"><div class="cstat-num">${have}</div><div class="cstat-lbl">Tengo</div></div>
          <div class="cstat red"><div class="cstat-num">${20-have}</div><div class="cstat-lbl">Faltan</div></div>
          <div class="cstat gold"><div class="cstat-num">${dups}</div><div class="cstat-lbl">Repet.</div></div>
        </div>
      </div>
    </div>
    <div class="sticker-grid" id="sticker-grid"></div>
  `;

  const grid = document.getElementById('sticker-grid');
  stickers.forEach(s => {
    const status = collection[s.code] || 0;
    const card = document.createElement('div');
    card.className = `sticker-card${status>=1?' have':''}${status>=2?' duplicate':''}`;
    card.id = `sticker-${s.code}`;
    card.innerHTML = `
      <div class="sticker-dup-badge">x${status}</div>
      <div class="sticker-check"><svg fill="white" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
      <div class="sticker-code">${s.code}${s.foil?'<span class="sticker-foil"> ★</span>':''}</div>
      <div class="sticker-name">${s.name}</div>
    `;
    card.onclick = () => openStickerModal(s.code, s.name, s.foil);
    grid.appendChild(card);
  });
}

function backToGroup() {
  showTab('group');
}

// ============================================================
// SPECIAL SECTION
// ============================================================
function openSpecialSection(key) {
  const section = SPECIAL_SECTIONS[key];
  // Reusar page-country pero con datos especiales
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-country').classList.add('active');
  document.getElementById('back-to-group-btn').onclick = () => showTab('dashboard');
  document.getElementById('back-to-group-btn').innerHTML = '← Volver al Dashboard';

  let have = section.stickers.filter(s=>(collection[s.code]||0)>=1).length;
  let dups = section.stickers.filter(s=>(collection[s.code]||0)>=2).length;
  const total = section.stickers.length;
  const el = document.getElementById('country-content');

  el.innerHTML = `
    <div class="country-header">
      <div class="country-flag-big">${section.icon}</div>
      <div style="flex:1">
        <div class="country-name" style="font-size:18px">${section.name}</div>
        <div class="country-stats-row">
          <div class="cstat green"><div class="cstat-num">${have}</div><div class="cstat-lbl">Tengo</div></div>
          <div class="cstat red"><div class="cstat-num">${total-have}</div><div class="cstat-lbl">Faltan</div></div>
          <div class="cstat gold"><div class="cstat-num">${dups}</div><div class="cstat-lbl">Repet.</div></div>
        </div>
      </div>
    </div>
    <div class="sticker-grid" id="sticker-grid"></div>
  `;

  const grid = document.getElementById('sticker-grid');
  section.stickers.forEach(s => {
    const status = collection[s.code] || 0;
    const card = document.createElement('div');
    card.className = `sticker-card${status>=1?' have':''}${status>=2?' duplicate':''}`;
    card.innerHTML = `
      <div class="sticker-dup-badge">x${status}</div>
      <div class="sticker-check"><svg fill="white" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
      <div class="sticker-code">${s.code}${s.foil?'<span class="sticker-foil"> ★</span>':''}</div>
      <div class="sticker-name">${s.name}</div>
    `;
    card.onclick = () => openStickerModal(s.code, s.name, s.foil);
    grid.appendChild(card);
  });
}

// ============================================================
// STICKER MODAL
// ============================================================
function openStickerModal(code, name, foil) {
  const status = collection[code] || 0;
  const modal = document.getElementById('modal');
  const content = document.getElementById('modal-content');
  content.innerHTML = `
    <div class="modal-title">${code} ${foil?'⭐':''}</div>
    <div class="modal-sub">${name}</div>
    <div style="background:var(--bg);border-radius:12px;padding:12px;margin-bottom:12px;text-align:center;">
      <div style="font-size:13px;color:var(--muted);font-weight:600">Estado actual</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:${status>=1?'var(--green)':'var(--red)'}">
        ${status===0?'❌ No la tengo':status===1?'✅ La tengo':'🔄 Repetida x'+status}
      </div>
    </div>
    <div class="modal-actions">
      ${status===0?`<button class="action-btn success" onclick="setStickerStatus('${code}',1)">✅ Marcar como tengo</button>`:''}
      ${status>=1?`<button class="action-btn primary" onclick="setStickerStatus('${code}',${status+1})">🔄 Agregar repetida (+1)</button>`:''}
      ${status>=2?`<button class="action-btn" style="background:var(--muted);color:white" onclick="setStickerStatus('${code}',${status-1})">➖ Quitar repetida</button>`:''}
      ${status>=1?`<button class="action-btn danger" onclick="setStickerStatus('${code}',0)">❌ Quitar de mi colección</button>`:''}
      <button class="action-btn" style="background:var(--border);color:var(--text)" onclick="closeModal()">Cerrar</button>
    </div>
  `;
  modal.classList.add('show');
}

async function setStickerStatus(code, status) {
  if(status <= 0) { delete collection[code]; status = 0; }
  else collection[code] = status;
  await saveSticker(code, status);
  closeModal();
  // Update card in-place
  const card = document.getElementById(`sticker-${code}`);
  if(card) {
    card.className = `sticker-card${status>=1?' have':''}${status>=2?' duplicate':''}`;
    const dup = card.querySelector('.sticker-dup-badge');
    if(dup) dup.textContent = `x${status}`;
  }
  updateCountryHeader();
  renderDashboard();
  showToast(status===0?'Sticker removido':'¡Sticker guardado! 🎉');
}

function updateCountryHeader() {
  if(!currentCountry) return;
  const stickers = genCountryStickers(currentCountry);
  let have = stickers.filter(s=>(collection[s.code]||0)>=1).length;
  let dups = stickers.filter(s=>(collection[s.code]||0)>=2).length;
  const greenEl = document.querySelector('.cstat.green .cstat-num');
  const redEl = document.querySelector('.cstat.red .cstat-num');
  const goldEl = document.querySelector('.cstat.gold .cstat-num');
  if(greenEl) greenEl.textContent = have;
  if(redEl) redEl.textContent = 20-have;
  if(goldEl) goldEl.textContent = dups;
}

// ============================================================
// MODAL
// ============================================================
function closeModal(e) {
  if(!e || e.target.id==='modal') {
    document.getElementById('modal').classList.remove('show');
  }
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ============================================================
// SEARCH
// ============================================================
function getAllStickers() {
  const all = [];
  Object.values(SPECIAL_SECTIONS).forEach(s => s.stickers.forEach(st => all.push(st)));
  Object.values(GROUPS).forEach(g => g.countries.forEach(c => {
    genCountryStickers(c).forEach(st => all.push(st));
  }));
  return all;
}

function doSearch(q) {
  const el = document.getElementById('search-results');
  if(!q.trim()) { el.innerHTML = ''; return; }
  const query = q.toLowerCase().trim();
  const results = getAllStickers().filter(s =>
    s.code.toLowerCase().includes(query) || s.name.toLowerCase().includes(query)
  ).slice(0, 40);

  if(!results.length) { el.innerHTML = '<div class="empty-state">No se encontraron stickers</div>'; return; }

  el.innerHTML = `<div class="sticker-grid">
    ${results.map(s => {
      const status = collection[s.code] || 0;
      return `<div class="sticker-card${status>=1?' have':''}${status>=2?' duplicate':''}" onclick="openStickerModal('${s.code}','${s.name.replace(/'/g,"\\'")}',${s.foil||false})">
        <div class="sticker-dup-badge">x${status}</div>
        <div class="sticker-check"><svg fill="white" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
        <div class="sticker-code">${s.code}</div>
        <div class="sticker-name">${s.name}</div>
      </div>`;
    }).join('')}
  </div>`;
}

// ============================================================
// INTERCAMBIOS
// ============================================================
function renderIntercambios() {
  const all = getAllStickers();
  const dups = all.filter(s => (collection[s.code]||0)>=2);
  const missing = all.filter(s => (collection[s.code]||0)===0);

  const dupEl = document.getElementById('duplicates-list');
  const wishEl = document.getElementById('wishlist-list');

  dupEl.innerHTML = dups.length ? dups.map(s => `
    <div class="swap-item">
      <div class="swap-code">${s.code}</div>
      <div style="flex:1;font-size:12px">${s.name}</div>
      <div style="background:var(--gold);color:white;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:800">x${collection[s.code]}</div>
    </div>
  `).join('') : '<div class="empty-state">Sin repetidas aún 🎉</div>';

  wishEl.innerHTML = missing.length ? missing.slice(0,50).map(s => `
    <div class="swap-item">
      <div class="swap-code">${s.code}</div>
      <div style="flex:1;font-size:12px">${s.name}</div>
    </div>
  `).join('') + (missing.length>50?`<div style="text-align:center;color:var(--muted);font-size:12px;padding:8px">...y ${missing.length-50} más</div>`:'')
  : '<div class="empty-state">¡Álbum completo! 🏆</div>';
}
