<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Panini FIFA World Cup 2026</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --red: #e63946;
  --gold: #f4a32a;
  --green: #2ec27e;
  --blue: #1d6fa4;
  --bg: #f0f4f8;
  --card: #ffffff;
  --text: #1a1a2e;
  --muted: #6b7280;
  --border: #e2e8f0;
  --shadow: 0 4px 20px rgba(0,0,0,0.10);
  --radius: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

.header {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  padding: 16px 16px 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 20px rgba(0,0,0,0.3);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon { font-size: 26px; }
.logo-text { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); letter-spacing: 1px; line-height: 1; }
.logo-sub { font-size: 10px; color: #94a3b8; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
.global-stats { display: flex; gap: 8px; }
.stat-pill {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 4px 10px;
  text-align: center;
}
.stat-pill .num { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--gold); line-height: 1; }
.stat-pill .lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

.tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 8px 14px;
  border-radius: 10px 10px 0 0;
  border: none;
  background: rgba(255,255,255,0.07);
  color: #94a3b8;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.5px;
}
.tab.active { background: var(--bg); color: var(--text); }
.tab:hover:not(.active) { background: rgba(255,255,255,0.12); color: white; }

.page { display: none; padding: 16px; }
.page.active { display: block; }

.section-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  margin-top: 18px;
}
.section-title:first-child { margin-top: 0; }

.special-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 4px;
  margin-bottom: 6px;
}
.special-row::-webkit-scrollbar { display: none; }
.special-card {
  flex-shrink: 0;
  background: white;
  border-radius: 12px;
  padding: 10px 14px;
  cursor: pointer;
  border: 2px solid var(--border);
  transition: all 0.2s;
  min-width: 130px;
  box-shadow: var(--shadow);
}
.special-card:active { transform: scale(0.96); }
.special-card .sc-icon { font-size: 22px; margin-bottom: 4px; }
.special-card .sc-name { font-weight: 800; font-size: 12px; color: var(--text); }
.special-card .sc-prog { font-size: 11px; color: var(--muted); }
.special-card .sc-bar { height: 4px; background: var(--border); border-radius: 4px; margin-top: 6px; overflow: hidden; }
.special-card .sc-bar-fill { height: 100%; border-radius: 4px; background: var(--gold); transition: width 0.4s; }

.groups-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.group-card {
  background: white;
  border-radius: var(--radius);
  padding: 12px;
  cursor: pointer;
  border: 2px solid var(--border);
  box-shadow: var(--shadow);
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.group-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--group-color, var(--gold));
}
.group-card:active { transform: scale(0.97); }
.group-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.group-letter { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--group-color, var(--gold)); line-height: 1; }
.group-pct { font-weight: 800; font-size: 13px; color: var(--muted); }
.group-flags { display: flex; gap: 4px; flex-wrap: wrap; }
.flag-chip {
  background: var(--bg);
  border-radius: 6px;
  padding: 2px 6px;
  font-size: 11px;
  font-weight: 800;
  color: var(--text);
}
.group-progress { margin-top: 8px; height: 5px; background: var(--border); border-radius: 5px; overflow: hidden; }
.group-progress-fill { height: 100%; border-radius: 5px; background: var(--group-color, var(--gold)); transition: width 0.5s ease; }

.back-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: white;
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 8px 14px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  margin-bottom: 14px;
  color: var(--text);
  box-shadow: var(--shadow);
  transition: all 0.15s;
}
.back-btn:active { transform: scale(0.97); }

.country-header {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  color: white;
  display: flex;
  align-items: center;
  gap: 14px;
}
.country-badge {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  color: var(--gold);
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 6px 12px;
  letter-spacing: 2px;
}
.country-name { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); }
.country-stats-row { display: flex; gap: 12px; margin-top: 6px; }
.cstat { text-align: center; }
.cstat-num { font-family: 'Bebas Neue', sans-serif; font-size: 20px; }
.cstat-lbl { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
.cstat.green .cstat-num { color: var(--green); }
.cstat.red .cstat-num { color: var(--red); }
.cstat.gold .cstat-num { color: var(--gold); }

.sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.sticker-card {
  background: white;
  border-radius: 10px;
  padding: 8px 6px;
  text-align: center;
  cursor: pointer;
  border: 2px solid var(--border);
  transition: all 0.15s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  position: relative;
}
.sticker-card.have { border-color: var(--green); background: #f0fdf4; }
.sticker-card.duplicate { border-color: var(--gold); background: #fffbeb; }
.sticker-card:active { transform: scale(0.93); }
.sticker-code { font-family: 'Bebas Neue', sans-serif; font-size: 15px; color: var(--blue); line-height: 1; }
.sticker-name { font-size: 9px; color: var(--muted); font-weight: 600; margin-top: 3px; line-height: 1.2; }
.sticker-check {
  position: absolute;
  top: 3px; right: 3px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--green);
  display: none;
  align-items: center;
  justify-content: center;
}
.sticker-card.have .sticker-check { display: flex; }
.sticker-check svg { width: 8px; height: 8px; }
.sticker-dup-badge {
  position: absolute;
  top: 3px; left: 3px;
  background: var(--gold);
  color: white;
  border-radius: 6px;
  font-size: 8px;
  font-weight: 800;
  padding: 1px 4px;
  display: none;
}
.sticker-card.duplicate .sticker-dup-badge { display: block; }
.foil-star { color: #f4a32a; font-size: 8px; font-weight: 800; }

.countries-list { display: flex; flex-direction: column; gap: 8px; }
.country-row {
  background: white;
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  border: 2px solid var(--border);
  box-shadow: var(--shadow);
  transition: all 0.15s;
}
.country-row:active { transform: scale(0.98); }
.country-row-code {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  color: var(--blue);
  min-width: 44px;
  text-align: center;
  background: var(--bg);
  border-radius: 8px;
  padding: 4px 6px;
}
.country-row-info { flex: 1; }
.country-row-name { font-weight: 800; font-size: 14px; }
.country-row-sub { font-size: 11px; color: var(--muted); }
.country-row-pct { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--muted); }
.country-row-bar { width: 60px; height: 5px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.country-row-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }

.swap-section {
  background: white;
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  border: 2px solid var(--border);
  box-shadow: var(--shadow);
}
.swap-title { font-weight: 800; font-size: 15px; margin-bottom: 10px; }
.swap-list { display: flex; flex-direction: column; gap: 8px; }
.swap-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: var(--bg);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
}
.swap-code { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: var(--blue); min-width: 48px; }
.empty-state { text-align: center; color: var(--muted); padding: 20px 0; font-size: 13px; }
.action-btn {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.action-btn.primary { background: var(--blue); color: white; }
.action-btn.success { background: var(--green); color: white; }
.action-btn.danger { background: var(--red); color: white; }
.action-btn.neutral { background: var(--border); color: var(--text); }
.action-btn.dim { background: var(--muted); color: white; }
.action-btn:active { transform: scale(0.97); }

.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: none;
  align-items: flex-end;
  backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; }
.modal {
  background: white;
  border-radius: 20px 20px 0 0;
  padding: 20px 16px 32px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
}
.modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 16px; }
.modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; margin-bottom: 4px; }
.modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.modal-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }

.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1a1a2e;
  color: white;
  padding: 10px 20px;
  border-radius: 50px;
  font-size: 13px;
  font-weight: 700;
  opacity: 0;
  transition: all 0.3s;
  z-index: 300;
  white-space: nowrap;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  flex-direction: column;
  gap: 12px;
  color: var(--muted);
  font-weight: 700;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.search-bar {
  display: flex;
  align-items: center;
  background: white;
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 8px 12px;
  gap: 8px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.search-bar input {
  flex: 1;
  border: none;
  outline: none;
  font-family: 'Nunito', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  background: transparent;
}
.search-icon { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<div class="header">

    <div class="logo">
      <div class="logo-icon">&#9917;</div>
      <div>
        <div class="logo-text">PANINI 2026</div>

    <span class="search-icon">&#128269;</span>
    <input type="text" id="search-input" placeholder="Buscar codigo de sticker..." oninput="doSearch(this.value)">

<div class="page" id="page-intercambios">

    <div class="swap-title">Me Faltan</div>

<script>
// ============================================================
// SUPABASE CONFIG
// ============================================================
var SUPABASE_URL = 'https://ynzeaenhhhjgehjcybpt.supabase.co/';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InluemVhZW5oaGhqZ2VoamN5YnB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NzE4MjgsImV4cCI6MjA5NDU0NzgyOH0.ySHiAV08Qvl0PbGgfKnf8sQEbyJ24t9yqjRQfBI2dR4';
var USER_ID = 'default';

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================================
// DATOS DEL ALBUM
// ============================================================
var GROUPS = {
  A: { color: '#e63946', countries: ['MEX','RSA','KOR','CZE'] },
  B: { color: '#3b82f6', countries: ['CAN','BIH','QAT','SUI'] },
  C: { color: '#10b981', countries: ['BRA','MAR','HAI','SCO'] },
  D: { color: '#f59e0b', countries: ['USA','PAR','AUS','TUR'] },
  E: { color: '#8b5cf6', countries: ['GER','CUW','CIV','ECU'] },
  F: { color: '#06b6d4', countries: ['NED','JPN','SWE','TUN'] },
  G: { color: '#f97316', countries: ['BEL','EGY','IRN','NZL'] },
  H: { color: '#ec4899', countries: ['ESP','CPV','SAU','URU'] },
  I: { color: '#14b8a6', countries: ['FRA','SEN','IRQ','NOR'] },

  K: { color: '#84cc16', countries: ['POR','COD','UZB','COL'] },
  L: { color: '#ef4444', countries: ['ENG','CRO','GHA','PAN'] }
};

var COUNTRY_NAMES = {
  MEX:'Mexico', RSA:'Sudafrica', KOR:'Corea del Sur', CZE:'Chequia',
  CAN:'Canada', BIH:'Bosnia', QAT:'Qatar', SUI:'Suiza',
  BRA:'Brasil', MAR:'Marruecos', HAI:'Haiti', SCO:'Escocia',
  USA:'USA', PAR:'Paraguay', AUS:'Australia', TUR:'Turkiye',
  GER:'Alemania', CUW:'Curazao', CIV:'C. de Marfil', ECU:'Ecuador',
  NED:'P. Bajos', JPN:'Japon', SWE:'Suecia', TUN:'Tunez',
  BEL:'Belgica', EGY:'Egipto', IRN:'Iran', NZL:'N. Zelanda',
  ESP:'Espana', CPV:'Cabo Verde', SAU:'Arabia S.', URU:'Uruguay',
  FRA:'Francia', SEN:'Senegal', IRQ:'Irak', NOR:'Noruega',
  ARG:'Argentina', ALG:'Argelia', AUT:'Austria', JOR:'Jordania',
  POR:'Portugal', COD:'Congo DR', UZB:'Uzbekistan', COL:'Colombia',
  ENG:'Inglaterra', CRO:'Croacia', GHA:'Ghana', PAN:'Panama'
};

// Stickers especiales
var SPECIAL_SECTIONS = {
  FWC: {
    name: 'FIFA World Cup', icon: 'FWC',
    stickers: (function() {
      var s = [];
      s.push({code:'00', name:'Panini Logo', foil:true});
      for (var i = 1; i <= 19; i++) {
        s.push({code:'FWC'+i, name:'FWC '+i, foil:true});
      }
      return s;
    })()
  },
  CC: {
    name: 'Coca-Cola', icon: 'CC',
    stickers: (function() {
      var s = [];
      for (var i = 1; i <= 12; i++) {
        s.push({code:'CC'+i, name:'CC '+i, foil:false});
      }
      return s;
    })()
  }
};

// Generar stickers de cada seleccion (20 por pais, sin nombres)
function genCountryStickers(code) {
  var s = [];
  s.push({code:code+'1', name:'Logo', foil:true});
  for (var i = 2; i <= 12; i++) {
    s.push({code:code+i, name:code+' '+i, foil:false});
  }
  s.push({code:code+'13', name:'Equipo', foil:false});
  for (var j = 14; j <= 20; j++) {
    s.push({code:code+j, name:code+' '+j, foil:false});
  }
  return s;
}

// ============================================================
// ESTADO
// ============================================================
var collection = {};
var currentGroup = null;
var currentCountry = null;

// ============================================================
// SUPABASE
// ============================================================
async function loadCollection() {
  try {
    var result = await sb.from('panini_collection')
      .select('sticker_code, status')
      .eq('user_id', USER_ID);
    if (result.error) throw result.error;
    collection = {};
    if (result.data) {
      result.data.forEach(function(r) {
        collection[r.sticker_code] = r.status;
      });
    }
  } catch(e) {
    var saved = localStorage.getItem('panini_col');
    if (saved) {
      try { collection = JSON.parse(saved); } catch(e2) { collection = {}; }
    }
  }
}

async function saveSticker(code, status) {
  try {
    if (status <= 0) {
      await sb.from('panini_collection')
        .delete()
        .eq('user_id', USER_ID)
        .eq('sticker_code', code);
    } else {
      await sb.from('panini_collection')
        .upsert(
          { user_id: USER_ID, sticker_code: code, status: status },
          { onConflict: 'user_id,sticker_code' }
        );
    }
  } catch(e) {
    // silencioso, ya guardamos en localStorage
  }
  localStorage.setItem('panini_col', JSON.stringify(collection));
}

// ============================================================
// INIT
// ============================================================
async function init() {
  document.getElementById('loading-screen').style.display = 'flex';
  await loadCollection();
  document.getElementById('loading-screen').style.display = 'none';
  renderDashboard();
  showTab('dashboard');
}

// ============================================================
// TABS
// ============================================================
function showTab(tab) {
  var tabNames = ['dashboard','buscar','intercambios'];
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function(t, i) {
    t.classList.remove('active');
    if (tabNames[i] === tab ||
        (tab === 'group' && tabNames[i] === 'dashboard') ||
        (tab === 'country' && tabNames[i] === 'dashboard')) {
      t.classList.add('active');
    }
  });
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  if (tab === 'dashboard') {
    document.getElementById('page-dashboard').classList.add('active');
    renderDashboard();
  } else if (tab === 'group') {
    document.getElementById('page-group').classList.add('active');
    renderGroupView();
  } else if (tab === 'country') {
    document.getElementById('page-country').classList.add('active');
    renderCountryView();
  } else if (tab === 'buscar') {
    document.getElementById('page-buscar').classList.add('active');
    document.getElementById('search-input').value = '';
    document.getElementById('search-results').innerHTML = '';
  } else if (tab === 'intercambios') {
    document.getElementById('page-intercambios').classList.add('active');
    renderIntercambios();
  }
}

// ============================================================
// DASHBOARD
// ============================================================
function getTotals() {
  var totalAll = 0;
  Object.values(SPECIAL_SECTIONS).forEach(function(s) { totalAll += s.stickers.length; });
  Object.values(GROUPS).forEach(function(g) { totalAll += g.countries.length * 20; });
  var totalHave = 0;
  Object.values(collection).forEach(function(v) { if (v >= 1) totalHave++; });
  return { have: totalHave, all: totalAll };
}

function renderDashboard() {
  var t = getTotals();
  document.getElementById('total-have').textContent = t.have;
  document.getElementById('total-missing').textContent = t.all - t.have;

  // Especiales
  var specialRow = document.getElementById('special-row');
  specialRow.innerHTML = '';
  Object.entries(SPECIAL_SECTIONS).forEach(function(entry) {
    var key = entry[0]; var section = entry[1];
    var have = section.stickers.filter(function(s) { return (collection[s.code]||0) >= 1; }).length;
    var total = section.stickers.length;
    var pct = Math.round(have / total * 100);
    var div = document.createElement('div');
    div.className = 'special-card';
    div.innerHTML = '<div class="sc-icon" style="font-family:\'Bebas Neue\',sans-serif;font-size:18px;color:var(--blue)">' + section.icon + '</div>' +
      '<div class="sc-name">' + section.name + '</div>' +
      '<div class="sc-prog">' + have + '/' + total + ' stickers</div>' +
      '<div class="sc-bar"><div class="sc-bar-fill" style="width:' + pct + '%"></div></div>';
    div.onclick = function() { openSpecialSection(key); };
    specialRow.appendChild(div);
  });

  // Grupos
  var grid = document.getElementById('groups-grid');
  grid.innerHTML = '';
  Object.entries(GROUPS).forEach(function(entry) {
    var letter = entry[0]; var group = entry[1];
    var gHave = 0; var gTotal = group.countries.length * 20;
    group.countries.forEach(function(c) {
      for (var i = 1; i <= 20; i++) {
        if ((collection[c + i] || 0) >= 1) gHave++;
      }
    });
    var pct = Math.round(gHave / gTotal * 100);
    var card = document.createElement('div');
    card.className = 'group-card';
    card.style.setProperty('--group-color', group.color);
    var chips = group.countries.map(function(c) {
      return '<div class="flag-chip">' + c + '</div>';
    }).join('');
    card.innerHTML = '<div class="group-header">' +
      '<div class="group-letter">Grupo ' + letter + '</div>' +
      '<div class="group-pct">' + pct + '%</div>' +
      '</div>' +
      '<div class="group-flags">' + chips + '</div>' +
      '<div class="group-progress"><div class="group-progress-fill" style="width:' + pct + '%"></div></div>';
    card.onclick = function(l) { return function() { currentGroup = l; showTab('group'); }; }(letter);
    grid.appendChild(card);
  });
}

// ============================================================
// GROUP VIEW
// ============================================================
function renderGroupView() {
  var group = GROUPS[currentGroup];
  var el = document.getElementById('group-content');
  var color = group.color;
  el.innerHTML = '<div style="background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:16px;padding:14px 16px;margin-bottom:14px;color:white;display:flex;align-items:center;gap:12px;">' +
    '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:40px;color:' + color + ';line-height:1">Grupo ' + currentGroup + '</div>' +
    '<div><div style="font-size:12px;color:#94a3b8;margin-top:4px">Toca un pais para ver sus stickers</div></div>' +
    '</div>' +
    '<div class="countries-list" id="countries-list"></div>';

  var list = document.getElementById('countries-list');
  group.countries.forEach(function(code) {
    var name = COUNTRY_NAMES[code] || code;
    var have = 0;
    for (var i = 1; i <= 20; i++) {
      if ((collection[code + i] || 0) >= 1) have++;
    }
    var pct = Math.round(have / 20 * 100);
    var row = document.createElement('div');
    row.className = 'country-row';
    row.innerHTML = '<div class="country-row-code">' + code + '</div>' +
      '<div class="country-row-info">' +
      '<div class="country-row-name">' + name + '</div>' +
      '<div style="display:flex;align-items:center;gap:6px;margin-top:3px;">' +
      '<div class="country-row-bar"><div class="country-row-bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
      '<div style="font-size:11px;color:var(--muted);font-weight:700">' + have + '/20</div>' +
      '</div></div>' +
      '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:20px;color:' + (pct === 100 ? 'var(--green)' : color) + '">' + pct + '%</div>' +
      '<div style="color:var(--muted)">&rsaquo;</div>';
    row.onclick = function(c) { return function() { currentCountry = c; showTab('country'); }; }(code);
    list.appendChild(row);
  });
}

// ============================================================
// COUNTRY VIEW
// ============================================================
function renderCountryView() {
  var code = currentCountry;
  var name = COUNTRY_NAMES[code] || code;
  var stickers = genCountryStickers(code);
  var have = stickers.filter(function(s) { return (collection[s.code]||0) >= 1; }).length;
  var dups = stickers.filter(function(s) { return (collection[s.code]||0) >= 2; }).length;
  var el = document.getElementById('country-content');

  document.getElementById('back-btn-country').onclick = function() { showTab('group'); };
  document.getElementById('back-btn-country').innerHTML = '&larr; Volver al Grupo';

  el.innerHTML = '<div class="country-header">' +
    '<div class="country-badge">' + code + '</div>' +
    '<div style="flex:1">' +
    '<div class="country-name">' + name + '</div>' +
    '<div class="country-stats-row">' +
    '<div class="cstat green"><div class="cstat-num">' + have + '</div><div class="cstat-lbl">Tengo</div></div>' +
    '<div class="cstat red"><div class="cstat-num">' + (20 - have) + '</div><div class="cstat-lbl">Faltan</div></div>' +
    '<div class="cstat gold"><div class="cstat-num">' + dups + '</div><div class="cstat-lbl">Repet.</div></div>' +
    '</div></div></div>' +
    '<div class="sticker-grid" id="sticker-grid"></div>';

  var grid = document.getElementById('sticker-grid');
  stickers.forEach(function(s) {
    var status = collection[s.code] || 0;
    var card = document.createElement('div');
    card.className = 'sticker-card' + (status >= 1 ? ' have' : '') + (status >= 2 ? ' duplicate' : '');
    card.id = 'sc-' + s.code;
    card.innerHTML = '<div class="sticker-dup-badge">x' + status + '</div>' +
      '<div class="sticker-check"><svg fill="white" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke="white" stroke-width="2.5" fill="none"/></svg></div>' +
      '<div class="sticker-code">' + s.code + (s.foil ? '<span class="foil-star"> *</span>' : '') + '</div>' +
      '<div class="sticker-name">' + s.name + '</div>';
    card.onclick = function(sc) { return function() { openStickerModal(sc.code, sc.name, sc.foil); }; }(s);
    grid.appendChild(card);
  });
}

// ============================================================
// SPECIAL SECTION
// ============================================================
function openSpecialSection(key) {
  var section = SPECIAL_SECTIONS[key];
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page-country').classList.add('active');

  var btn = document.getElementById('back-btn-country');
  btn.innerHTML = '&larr; Volver al Dashboard';
  btn.onclick = function() { showTab('dashboard'); };

  var have = section.stickers.filter(function(s) { return (collection[s.code]||0) >= 1; }).length;
  var dups = section.stickers.filter(function(s) { return (collection[s.code]||0) >= 2; }).length;
  var total = section.stickers.length;
  var el = document.getElementById('country-content');

  el.innerHTML = '<div class="country-header">' +
    '<div class="country-badge" style="font-size:18px">' + section.icon + '</div>' +
    '<div style="flex:1">' +
    '<div class="country-name">' + section.name + '</div>' +
    '<div class="country-stats-row">' +
    '<div class="cstat green"><div class="cstat-num">' + have + '</div><div class="cstat-lbl">Tengo</div></div>' +
    '<div class="cstat red"><div class="cstat-num">' + (total - have) + '</div><div class="cstat-lbl">Faltan</div></div>' +
    '<div class="cstat gold"><div class="cstat-num">' + dups + '</div><div class="cstat-lbl">Repet.</div></div>' +
    '</div></div></div>' +
    '<div class="sticker-grid" id="sticker-grid"></div>';

  var grid = document.getElementById('sticker-grid');
  section.stickers.forEach(function(s) {
    var status = collection[s.code] || 0;
    var card = document.createElement('div');
    card.className = 'sticker-card' + (status >= 1 ? ' have' : '') + (status >= 2 ? ' duplicate' : '');
    card.id = 'sc-' + s.code;
    card.innerHTML = '<div class="sticker-dup-badge">x' + status + '</div>' +
      '<div class="sticker-check"><svg fill="white" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke="white" stroke-width="2.5" fill="none"/></svg></div>' +
      '<div class="sticker-code">' + s.code + (s.foil ? '<span class="foil-star"> *</span>' : '') + '</div>' +
      '<div class="sticker-name">' + s.name + '</div>';
    card.onclick = function(sc) { return function() { openStickerModal(sc.code, sc.name, sc.foil); }; }(s);
    grid.appendChild(card);
  });
}

// ============================================================
// MODAL
// ============================================================
function openStickerModal(code, name, foil) {
  var status = collection[code] || 0;
  var modal = document.getElementById('modal');
  var content = document.getElementById('modal-content');

  var statusText = status === 0 ? 'No la tengo' : status === 1 ? 'La tengo' : 'Repetida x' + status;
  var statusColor = status >= 1 ? 'var(--green)' : 'var(--red)';
  var foilLabel = foil ? ' (Foil)' : '';

  var buttons = '';
  if (status === 0) {
    buttons += '<button class="action-btn success" onclick="setStickerStatus(\'' + code + '\',1)">Marcar como tengo</button>';
  }
  if (status >= 1) {
    buttons += '<button class="action-btn primary" onclick="setStickerStatus(\'' + code + '\',' + (status + 1) + ')">Agregar repetida (+1)</button>';
  }
  if (status >= 2) {
    buttons += '<button class="action-btn dim" onclick="setStickerStatus(\'' + code + '\',' + (status - 1) + ')">Quitar repetida (-1)</button>';
  }
  if (status >= 1) {
    buttons += '<button class="action-btn danger" onclick="setStickerStatus(\'' + code + '\',0)">Quitar de coleccion</button>';
  }
  buttons += '<button class="action-btn neutral" onclick="closeModal()">Cerrar</button>';

  content.innerHTML = '<div class="modal-title">' + code + foilLabel + '</div>' +
    '<div class="modal-sub">' + name + '</div>' +
    '<div style="background:var(--bg);border-radius:12px;padding:12px;margin-bottom:12px;text-align:center;">' +
    '<div style="font-size:13px;color:var(--muted);font-weight:600">Estado actual</div>' +
    '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:28px;color:' + statusColor + '">' + statusText + '</div>' +
    '</div>' +
    '<div class="modal-actions">' + buttons + '</div>';

  modal.classList.add('show');
}

async function setStickerStatus(code, status) {
  if (status <= 0) {
    delete collection[code];
    status = 0;
  } else {
    collection[code] = status;
  }
  await saveSticker(code, status);
  closeModal();

  // Actualizar tarjeta en pantalla
  var card = document.getElementById('sc-' + code);
  if (card) {
    card.className = 'sticker-card' + (status >= 1 ? ' have' : '') + (status >= 2 ? ' duplicate' : '');
    var dup = card.querySelector('.sticker-dup-badge');
    if (dup) dup.textContent = 'x' + status;
  }

  updateCountryHeader();
  renderDashboard();
  showToast(status === 0 ? 'Sticker removido' : 'Sticker guardado!');
}

function updateCountryHeader() {
  if (!currentCountry) return;
  var stickers = genCountryStickers(currentCountry);
  var have = stickers.filter(function(s) { return (collection[s.code]||0) >= 1; }).length;
  var dups = stickers.filter(function(s) { return (collection[s.code]||0) >= 2; }).length;
  var greenEl = document.querySelector('.cstat.green .cstat-num');
  var redEl = document.querySelector('.cstat.red .cstat-num');
  var goldEl = document.querySelector('.cstat.gold .cstat-num');
  if (greenEl) greenEl.textContent = have;
  if (redEl) redEl.textContent = 20 - have;
  if (goldEl) goldEl.textContent = dups;
}

function closeModal(e) {
  if (!e || e.target.id === 'modal') {
    document.getElementById('modal').classList.remove('show');
  }
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

// ============================================================
// BUSCAR
// ============================================================
function getAllStickers() {
  var all = [];
  Object.values(SPECIAL_SECTIONS).forEach(function(s) {
    s.stickers.forEach(function(st) { all.push(st); });
  });
  Object.keys(GROUPS).forEach(function(g) {
    GROUPS[g].countries.forEach(function(c) {
      genCountryStickers(c).forEach(function(st) { all.push(st); });
    });
  });
  return all;
}

function doSearch(q) {
  var el = document.getElementById('search-results');
  if (!q.trim()) { el.innerHTML = ''; return; }
  var query = q.toLowerCase().trim();
  var results = getAllStickers().filter(function(s) {
    return s.code.toLowerCase().indexOf(query) !== -1 || s.name.toLowerCase().indexOf(query) !== -1;
  }).slice(0, 40);

  if (!results.length) {
    el.innerHTML = '<div class="empty-state">No se encontraron stickers</div>';
    return;
  }

  var html = '<div class="sticker-grid">';
  results.forEach(function(s) {
    var status = collection[s.code] || 0;
    html += '<div class="sticker-card' + (status >= 1 ? ' have' : '') + (status >= 2 ? ' duplicate' : '') + '" id="sc-' + s.code + '" onclick="openStickerModal(\'' + s.code + '\',\'' + s.name + '\',' + (s.foil || false) + ')">' +
      '<div class="sticker-dup-badge">x' + status + '</div>' +
      '<div class="sticker-check"><svg fill="white" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke="white" stroke-width="2.5" fill="none"/></svg></div>' +
      '<div class="sticker-code">' + s.code + '</div>' +
      '<div class="sticker-name">' + s.name + '</div>' +
      '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

// ============================================================
// INTERCAMBIOS
// ============================================================
function renderIntercambios() {
  var all = getAllStickers();
  var dups = all.filter(function(s) { return (collection[s.code]||0) >= 2; });
  var missing = all.filter(function(s) { return (collection[s.code]||0) === 0; });

  var dupEl = document.getElementById('duplicates-list');
  var wishEl = document.getElementById('wishlist-list');

  if (dups.length) {
    dupEl.innerHTML = dups.map(function(s) {
      return '<div class="swap-item">' +
        '<div class="swap-code">' + s.code + '</div>' +
        '<div style="flex:1;font-size:12px">' + s.name + '</div>' +
        '<div style="background:var(--gold);color:white;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:800">x' + collection[s.code] + '</div>' +
        '</div>';
    }).join('');
  } else {
    dupEl.innerHTML = '<div class="empty-state">Sin repetidas aun</div>';
  }

  if (missing.length) {
    var show = missing.slice(0, 60);
    wishEl.innerHTML = show.map(function(s) {
      return '<div class="swap-item">' +
        '<div class="swap-code">' + s.code + '</div>' +
        '<div style="flex:1;font-size:12px">' + s.name + '</div>' +
        '</div>';
    }).join('') +
    (missing.length > 60 ? '<div style="text-align:center;color:var(--muted);font-size:12px;padding:8px">...y ' + (missing.length - 60) + ' mas</div>' : '');
  } else {
    wishEl.innerHTML = '<div class="empty-state">Album completo!</div>';
  }
}

// ============================================================
// START
// ============================================================
init();
</script>
